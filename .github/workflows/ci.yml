name: ROM-free CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-and-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python tools/progress/build.py --evidence progress/progress.json --out progress/site --markdown PROGRESS.md --check
      - run: python scripts/check-asset-boundary.py

  native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            preset: windows-msvc
            build: windows-msvc-debug
          - os: ubuntu-latest
            preset: linux-ninja
            build: linux-ninja-debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.build }}
      - run: ctest --preset ${{ matrix.build }}
